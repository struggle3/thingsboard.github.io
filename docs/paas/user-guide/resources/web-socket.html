<!DOCTYPE HTML>
<html>
<head>

    <script type="text/javascript">
        function WebSocketAPIExample() {
            var token = "$YOUR_JWT_TOKEN";
            var entityId = "$YOUR_DEVICE_ID";
            var webSocket = new WebSocket("wss://thingsboard.cloud/api/ws");

            if (entityId === "$YOUR_DEVICE_ID") {
                alert("设备ID无效！");
                webSocket.close();
            }

            if (token === "$YOUR_JWT_TOKEN") {
                alert("JWT令牌无效！");
                webSocket.close();
            }

            webSocket.onopen = function () {
                var object = {
                    authCmd: {
                        cmdId: 0,
                        token: token
                    },
                    cmds: [
                        {
                            entityType: "DEVICE",
                            entityId: entityId,
                            scope: "LATEST_TELEMETRY",
                            cmdId: 10,
                            type: "TIMESERIES"
                        }
                    ]
                };
                var data = JSON.stringify(object);
                webSocket.send(data);
                alert("消息已发送：" + data);
            };

            webSocket.onmessage = function (event) {
                var received_msg = event.data;
                alert("已收到消息：" + received_msg);
            };

            webSocket.onclose = function (event) {
                alert("连接已关闭！");
            };
        }
    </script>

</head>
<body>

<div id="sse">
    <a href="javascript:WebSocketAPIExample()">运行 WebSocket</a>
</div>

</body>
</html>
