0:
  type: "General"
  name: "智能能源"
  description: "以可靠、容错的方式采集与存储智能电表数据，在可定制的终端用户仪表盘上展示实时与历史能耗，并与第三方分析框架和方案集成。"
  media:
    image: "https://img.thingsboard.io/usecases/smart-energy/video/smart-energy.png"
    alt: "智能能源"
    video: ["https://video.thingsboard.io/usecases/smart-energy.mp4", "https://video.thingsboard.io/usecases/smart-energy.webm"]
  href: "/use-cases/smart-energy/"
1:
  type: "SCADA"
  name: "SCADA泳池系统"
  description: "SCADA系统通常分为传统型与高性能型。使用SCADA实时监控与管控工业流程，在仪表盘上使用SCADA符号创建和管理任意工作流，按需灵活设计与监督运营。"
  media:
    image: "https://img.thingsboard.io/usecases/scada/video/scada.png"
    alt: "了解更多SCADA泳池"
    video: ["https://video.thingsboard.io/usecases/scada.mp4", "https://video.thingsboard.io/usecases/scada.webm"]
  href: "/use-cases/scada/"
2:
  type: "SCADA"
  name: "SCADA油气钻井系统"
  description: "使用SCADA与ThingsBoard实现钻井作业自动化，实时控制钻机、泵与防喷器，可视化关键参数并提升作业安全。灵活的SCADA符号模板可适配任意生产场景。"
  media:
    image: "https://img.thingsboard.io/solutions/scada_drilling_system/hp-scada-systems-in-drilling-1.png"
    alt: "了解更多SCADA油气钻井系统"
    video: ["https://video.thingsboard.io/usecases/hp-drilling-scada-system.mp4", "https://video.thingsboard.io/usecases/hp-drilling-scada-system.webm"]
  href: "/use-cases/scada-oil-and-gas-drilling-system/"
3:
  type: "SCADA"
  name: "SCADA能源管理"
  description: "全面实时掌握能耗与发电。使用ThingsBoard驱动的SCADA监控、分析与优化能源流（从发电到终端用能），通过直观仪表盘及与工业设备无缝集成追踪能效、预测需求峰值并降低成本。"
  media:
    image: "https://img.thingsboard.io/solutions/scada_energy_management/scada-energy-management-1.png"
    alt: "了解更多SCADA能源管理"
    video: ["https://video.thingsboard.io/usecases/scada-energy-management.mp4", "https://video.thingsboard.io/usecases/scada-energy-management.webm"]
  href: "/use-cases/scada-energy-management/"
4:
  type: "General"
  name: "环境监测"
  description: "通过多种传感器监测与分析室内外环境。ThingsBoard支持采用NB IoT、LoRaWAN、SigFox、MQTT、CoAP、HTTP、LwM2M等现代连接技术与协议进行数据采集。"
  media:
    image: "https://img.thingsboard.io/usecases/environment-monitoring/video/environment-monitoring.png"
    alt: "环境监测仪表盘"
    video: ["https://video.thingsboard.io/usecases/environment-monitoring.mp4", "https://video.thingsboard.io/usecases/environment-monitoring.webm"]
  href: "/use-cases/environment-monitoring/"
5:
  type: "General"
  name: "智能办公"
  description: "保障员工健康与安全以提升组织效率。通过监测与调控办公室室内环境优化资源消耗。ThingsBoard提供丰富的数据可视化、强大处理引擎、远程控制与OTA更新能力。"
  media:
    image: "/images/usecases/smart-office/smart-office-1-v2.webp"
    alt: "了解更多智能办公"
    video: ["https://video.thingsboard.io/usecases/smart-office-v3.mp4", "https://video.thingsboard.io/usecases/smart-office-v3.webm"]
  href: "/use-cases/smart-office/"
6:
  type: "General"
  name: "水表计量"
  description: "使用ThingsBoard实现用水数据采集、分析与防作弊。通过交互式仪表盘供管理员与终端用户查看水表状态与用水统计，支持短信与邮件告警并与外部计费系统集成。"
  media:
    image: "https://img.thingsboard.io/usecases/water-metering/video/water-metering.png"
    alt: "水表计量仪表盘"
    video: ["https://video.thingsboard.io/usecases/water-metering.mp4", "https://video.thingsboard.io/usecases/water-metering.webm"]
  href: "/use-cases/water-metering/"
7:
  type: "General"
  name: "智慧零售"
  description: "通过监测冷柜与冰柜保障食品储存质量，利用智能货架保障商品可得性，通过动检与消防告警保障安全。ThingsBoard提供超市资产监控、历史数据浏览及基于用户阈值告警的解决方案模板。"
  media:
    image: "https://img.thingsboard.io/usecases/smart-retail/video/smart-retail.png"
    alt: "智慧零售仪表盘"
    video: ["https://video.thingsboard.io/usecases/smart-retail.mp4", "https://video.thingsboard.io/usecases/smart-retail.webm"]
  href: "/use-cases/smart-retail/"
8:
  type: "General"
  name: "智慧农业"
  description: "通过IoT传感器采集土壤状况、设施状态等农业生产关键指标，并使用ThingsBoard平台提供的可定制终端用户仪表盘进行可视化。"
  media:
    image: "https://img.thingsboard.io/usecases/smart-farming/video/smart-farming.png"
    alt: "智慧农业仪表盘"
    video: ["https://video.thingsboard.io/usecases/smart-farming.mp4", "https://video.thingsboard.io/usecases/smart-farming.webm"]
  href: "/use-cases/smart-farming/"
9:
  type: "General"
  name: "现场车队追踪"
  description: "使用ThingsBoard实时监控工业或矿区的挖掘机、运输车与设备。借助电子围栏、计算字段与智能告警追踪油耗、发现越区并优化设备效率，无需规则链即可实现零代码方案，提升运营安全与管控。"
  media:
    image: "/images/usecases/fleet-tracking/site-fleet-tracking-1.webp"
    alt: "车队追踪仪表盘"
    video: ["https://video.thingsboard.io/usecases/mine-site-monitoring.mp4", "https://video.thingsboard.io/use-cases/mine-site-monitoring.webm"]
  href: "/use-cases/site-fleet-tracking/"
10:
  type: "General"
  name: "智能计量"
  description: "以可靠、容错的方式采集、存储与汇总智能表计数据，分析资源消耗并对泄漏、异常或作弊发出告警，将分析结果呈现给终端用户。"
  media:
    image: "https://img.thingsboard.io/usecases/smart-metering/video/smart-metering.png"
    alt: "智能计量仪表盘"
    video: ["https://video.thingsboard.io/usecases/smart-metering.mp4", "https://video.thingsboard.io/usecases/smart-metering.webm"]
  href: "/use-cases/smart-metering/"
